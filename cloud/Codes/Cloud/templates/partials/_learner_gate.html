{# 퀴즈 진입 게이트 — 소속·이름·직급을 받아야 문항에 들어갈 수 있다.
   태블릿을 여러 학습자가 돌아가며 쓰므로, 세션(브라우저 탭) 동안 한 번만 받고
   그 뒤 주제를 옮겨도 다시 묻지 않는다 (sessionStorage, static/js/learner-gate.js).
   결과 로그(TEST_RESULT/*.json)에 그대로 쓰이므로 자유 입력이고, 다 채워야
   "시작" 이 눌린다 — 스크림·X 로 닫는 길은 없다. #}
<div class="modal" data-learner-gate hidden>
  <div class="modal__scrim"></div>

  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="learner-gate-title">
    <div class="modal__head">
      <span class="modal__title" id="learner-gate-title">응시자 정보</span>
      <span class="modal__sub">퀴즈 결과 기록에 쓰입니다</span>
    </div>

    <div class="modal__body">
      <div class="gate__field">
        <label for="learner-org">소속</label>
        <input type="text" id="learner-org" data-learner-org autocomplete="off">
      </div>
      <div class="gate__field">
        <label for="learner-name">이름</label>
        <input type="text" id="learner-name" data-learner-name autocomplete="off">
      </div>
      <div class="gate__field">
        <label for="learner-position">직급</label>
        <input type="text" id="learner-position" data-learner-position autocomplete="off">
      </div>
    </div>

    <div class="modal__foot modal__foot--end">
      <button class="btn btn--primary gate__start" type="button" data-learner-start disabled>시작</button>
    </div>
  </div>
</div>
